# The development database. `bun run dev` starts it before anything else.
#
# Stock Postgres, deliberately. litics — the analytics engine — needs nothing
# installed: its whole schema is plain SQL and plpgsql, and the journey suite
# asserts that `pg_extension` holds one row. Development runs the same image
# a managed provider would give you, so "works locally" means something.
#
# For self-hosting Counted see self-host/ (full app + db).
services:
  db:
    image: postgres:17
    # The live suites run concurrently, each with its own database and pool.
    # 100 is the built-in default and leaves no room for that.
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      # 5434, not 5432, so this never collides with a Postgres someone already
      # runs. scripts/dev.sh defaults DATABASE_URL to the same port.
      - "5434:5432"
    environment:
      POSTGRES_USER: counted
      POSTGRES_PASSWORD: counted
      POSTGRES_DB: counted
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # A volume of its own. A data directory initialised by a different major
      # version makes the image refuse to start with an error about version
      # mismatch that reads like a corrupt volume. Counted has no users, so
      # nothing in the older `pgdata-litics` volume is worth keeping;
      # `docker volume rm counted_pgdata-litics` when you are ready to reclaim
      # the disk.
      - pgdata-17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counted -d counted"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata-17:
