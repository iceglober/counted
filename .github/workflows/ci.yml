name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately the stock image, not timescale/timescaledb. The v2 store
    # requires no extension, and this is what keeps that true.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: counted
          POSTGRES_PASSWORD: counted
          POSTGRES_DB: counted
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counted"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDKs
        run: |
          cd packages/sdk && bun run build
          cd ../react && bun run build
          cd ../migrate && bun run build
          cd ../claude-code && bun run build

      - name: Verify plugin hook bin is committed in sync
        run: |
          git diff --exit-code -- packages/claude-code/bin \
            || { echo "::error::packages/claude-code/bin is stale — run 'bun run build' in packages/claude-code and commit"; exit 1; }

      # v2 rewrite: the layering is enforced here, not in review.
      - name: Architecture rules (v2 layering)
        run: bun run arch

      # The OpenAPI document is generated from the Zod schemas the server
      # validates with. Regenerate and fail on any difference, so the spec
      # cannot describe an API the code does not implement.
      - name: OpenAPI drift
        run: bun run openapi:check

      - name: Build v2 packages
        run: bun run build:v2

      - name: Test v2 packages
        run: bun run test:v2
        env:
          # A guard that silently passes turns "the database was unreachable in
          # CI" into a green build, so the live adapter tests must be required.
          REQUIRE_DB: "1"
          TEST_ADMIN_URL: postgres://counted:counted@localhost:5432/postgres
          # The service below is a STOCK postgres image. This flag turns on the
          # assertion that the extension really is absent — which is where the
          # storage decision (plain PostgreSQL, no TimescaleDB) is proven
          # rather than assumed.
          EXPECT_PLAIN_POSTGRES: "1"

      - name: Typecheck
        run: bun run typecheck

      - name: Build app
        run: bun run build
        env:
          DATABASE_URL: "postgres://placeholder:placeholder@localhost:5432/counted"
          BETTER_AUTH_SECRET: "ci-build-secret-not-real"
          BETTER_AUTH_URL: "http://localhost:3000"
          NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"

  release:
    name: Release SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDKs
        run: |
          cd packages/sdk && bun run build
          cd ../react && bun run build
          cd ../migrate && bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install changesets CLI
        run: npm install -g @changesets/cli

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: changeset version
          publish: changeset publish
          title: "Version Packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
