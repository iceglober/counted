name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately the stock image, not timescale/timescaledb. The v2 store
    # requires no extension, and this is what keeps that true.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: counted
          POSTGRES_PASSWORD: counted
          POSTGRES_DB: counted
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U counted"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDKs
        run: bun run sdks:build

      - name: Verify plugin hook bin is committed in sync
        run: |
          git diff --exit-code -- packages/agent-claude-code/bin packages/agent-telemetry/bin \
            || { echo "::error::a hook bin is stale — run 'bun run agents:build' and commit"; exit 1; }

      - name: Verify clean npm consumer installation
        run: bun scripts/check-npm-packages.ts

      - name: Deployment workflow regression checks
        run: bun test tests/deploy

      # v2 rewrite: the layering is enforced here, not in review.
      - name: Architecture rules (v2 layering)
        run: bun run arch

      # The OpenAPI document is generated from the Zod schemas the server
      # validates with. Regenerate and fail on any difference, so the spec
      # cannot describe an API the code does not implement.
      - name: OpenAPI drift
        run: bun run openapi:check

      # One project, tests included: `tsconfig.json` lists `tests/**` and every
      # package's `src/**`, so a type error in a test is a failed build.
      - name: Typecheck (including tests)
        run: bun run typecheck

      - name: Build console and API documentation
        run: |
          bun run --cwd apps/web build
          bun run --cwd apps/docs build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # The generated SDK constants are committed. Regenerating must be a
      # no-op, or the four languages are reading different numbers.
      - name: Contract drift
        run: bun run contract:check

      # The cross-language SDK contract. Go and Rust drivers are built first;
      # a missing toolchain fails the job rather than skipping quietly, because
      # a suite that reports green because it ran nothing is the failure this
      # exists to prevent.
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build conformance drivers
        run: bun run conformance:build
      - name: SDK conformance (js, python, go, rust)
        run: bun run conformance

      - name: Test
        run: bun run test
        env:
          # The live adapter suites read this. A guard that silently skips turns
          # "the database was unreachable in CI" into a green build, so
          # REQUIRE_DB makes an unreachable database a failure with a reason.
          COUNTED_TEST_DATABASE_URL: postgres://counted:counted@localhost:5432/counted
          REQUIRE_DB: "1"
          # The service above is the STOCK postgres image. This flag turns on
          # packages/adapters/postgres/src/plain-postgres.test.ts, which asserts
          # the application database has no extension beyond plpgsql — where
          # "runs on plain PostgreSQL" is proven rather than assumed.
          EXPECT_PLAIN_POSTGRES: "1"

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Console journeys (desktop and mobile)
        run: bun run test:browser
        env:
          COUNTED_BROWSER_DATABASE_URL: postgres://counted:counted@127.0.0.1:5432/counted
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            playwright-report/
            test-results/browser/
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, mcp, web, docs]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Each image gets a separate native runner. Nothing is pushed, no ports
      # are published, and runtime checks receive no deployment credentials.
      - name: Build production image
        run: docker build --progress=plain --tag "counted-ci:${{ matrix.service }}" --file "deploy/${{ matrix.service }}.Dockerfile" .

      - name: Check image entry point and runtime
        run: bun tests/deploy/container-smoke.ts "${{ matrix.service }}"
