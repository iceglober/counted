name: SDK Conformance

# Every SDK is driven through the same golden traces, in every language, against
# one in-process capture server. That suite is the parity contract — it is what
# caught macOS being reported under four different names.
#
# It runs on `v2` as well as `main`. Until cutover the branch under development
# is `v2`, and a check that only runs on `main` first reports on the code at the
# moment it is too late to be useful.

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: SDK conformance (JS, Python, Go, Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pre-built so the first scenario doesn't race a cold compile and time
      # out. Via the package.json scripts rather than inline commands, so this
      # cannot drift from what a developer runs locally — it had: the Rust step
      # still said `--example conformance`, a v1 layout, and errored outright.
      - name: Pre-build the compiled drivers
        run: bun run conformance:build

      - name: Run SDK conformance
        run: bun run conformance

  readmes:
    name: SDK README examples compile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Separate from conformance because it fails for a different reason, and the
    # distinction is worth keeping: conformance failing means an SDK behaves
    # wrongly; this failing means an SDK is *documented* wrongly. The second is
    # the one that becomes permanent — these READMEs render on the PyPI,
    # crates.io and pkg.go.dev pages, and a published version cannot be
    # withdrawn, only superseded.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile every example in the SDK READMEs
        run: bun run readmes
