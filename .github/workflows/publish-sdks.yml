name: Publish SDKs (PyPI / crates.io / Go)

# Parallel to the npm release (changesets in ci.yml). Every job is idempotent and
# self-gating:
#   - skips if the registry already has that version, and
#   - skips (cleanly, not a failure) if the required secret isn't configured yet.
#
# MANUAL-ONLY, and the ordering matters.
#
# The v2 SDKs default to https://api.counted.dev/v1/events. That endpoint does
# not answer until the v2 API is deployed and DNS is cut over, so publishing
# before then ships a 2.0.0 that 404s for anyone who installs it — and a
# registry version cannot be withdrawn or corrected, only superseded. Run this
# as the last step of cutover, not before.
#
# PyPI needs no secret: it uses Trusted Publishing (OIDC), so the only thing
# that has to exist on PyPI's side is a publisher registered against the
# `counted` project naming this repo and this workflow file.
#
# crates.io still needs CARGO_REGISTRY_TOKEN; that job skips cleanly (not a
# failure) without it, so a premature run is harmless rather than half-done.
#
# The Go job needs no secret — it pushes a tag — but the module proxy caches
# that tag permanently, so it is under the same ordering rule.
on:
  workflow_dispatch: {}

jobs:
  # Every publish job waits on this one. Each registry renders the package's
  # README on its page, and a version cannot be withdrawn or corrected — so an
  # example that does not compile is permanent, and the cheapest moment to
  # notice is the minute before uploading.
  #
  # Not hypothetical: the Rust quick start called `serde_json::json!` while the
  # install block listed only `counted-sdk`, so the first thing a reader copied
  # did not build.
  readmes:
    name: SDK README examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run readmes

  python:
    name: Publish counted to PyPI
    needs: readmes
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC). PyPI verifies the repository and workflow
    # filename against a publisher registered on the project, then mints a
    # short-lived token for that one upload. There is no PYPI_TOKEN: nothing to
    # leak, rotate, or scope.
    #
    # `id-token: write` is what allows the job to request the OIDC assertion.
    # Without it the upload fails to authenticate, and the failure reads like a
    # permissions problem with the package rather than with the workflow.
    #
    # The publisher must name the **distribution** — `counted`, per
    # pyproject.toml — not the repository. A publisher registered under any
    # other name does not match and the upload is rejected.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide whether to publish
        id: check
        working-directory: packages/python
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -fsS -o /dev/null "https://pypi.org/pypi/counted/$VERSION/json"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::counted $VERSION already on PyPI — skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist

  rust:
    name: Publish counted-sdk to crates.io
    needs: readmes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Decide whether to publish
        id: check
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # crates.io returns 200 for an existing version, 404 otherwise; it
          # requires a User-Agent. A 404 (curl -f -> nonzero) means "not yet published".
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CARGO_REGISTRY_TOKEN secret not set — skipping crates.io publish"
          elif curl -fsS -o /dev/null -H "User-Agent: counted-ci (austin@iceglobe.io)" \
              "https://crates.io/api/v1/crates/counted-sdk/$VERSION"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::counted-sdk $VERSION already on crates.io — skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

  go:
    name: Tag Go module
    needs: readmes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need existing tags
      - name: Tag packages/go/v<VERSION> if new
        run: |
          VERSION=$(tr -d '[:space:]' < packages/go/VERSION)
          TAG="packages/go/v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists — skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "::notice::Pushed $TAG — the Go module proxy indexes it on first fetch"
          fi
